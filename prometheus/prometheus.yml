global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'ssle-monitor'

rule_files:
  - "ssle_rules.yml"

# Targets use the Incus DNS names (<container>.incus), so a container getting a new
# DHCP address does not break scraping.
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ssle-registry'
    static_configs:
      - targets: ['registry.incus:5050']

  - job_name: 'ssle-ingestion'
    static_configs:
      - targets: ['ingestion.incus:5001']

  - job_name: 'ssle-storage'
    static_configs:
      - targets: ['storage.incus:5002']

  - job_name: 'ssle-analytics'
    static_configs:
      - targets: ['analytics.incus:5003']

  - job_name: 'ssle-sensor'
    static_configs:
      - targets: ['sensor.incus:8000']
