groups:
  - name: ssle-ddos-alerts
    interval: 5s
    rules:
      - alert: SSLEHighRequestRate
        expr: sum by (job) (rate(http_requests_total[15s])) > 5
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: "High request rate on {{ $labels.job }}"
          description: "Total request rate is {{ $value | printf \"%.2f\" }} req/s (baseline is < 0.5 req/s)."

      - alert: SSLEHighP95Latency
        expr: histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[15s]))) > 0.05
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "95th percentile latency reached {{ $value | printf \"%.4f\" }}s under load."

      - alert: SSLEHighConcurrentRequests
        expr: sum by (job) (http_requests_in_progress) > 3
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: "Request backlog building on {{ $labels.job }}"
          description: "{{ $value }} requests currently in progress."

  # Correlation: several symptoms are combined into ONE alert that names the root cause.
  #   kind=symptom     something is wrong somewhere (errors seen by a dependent service)
  #   kind=root-cause  the symptom plus the state of its dependency explain WHY
  # Exercised by test-rootcause.sh (stops the storage container).
  - name: ssle-root-cause
    interval: 5s
    rules:
      - alert: SSLEInstanceDown
        expr: up{job=~"ssle-.+"} == 0
        for: 10s
        labels:
          severity: critical
          kind: root-cause
          root_cause: "{{ $labels.job }}"
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) is not answering scrapes"

      - alert: SSLEStorageErrorsSymptom
        expr: >
          (sum(increase(analytics_storage_errors_total[1m])) or vector(0))
          + (sum(increase(ingestion_readings_total{result="storage_error"}[1m])) or vector(0)) > 0
        labels:
          severity: warning
          kind: symptom
        annotations:
          summary: "Ingestion/analytics cannot use storage ({{ $value | printf \"%.0f\" }} errors in 1 min)"

      - alert: SSLERootCauseStorageDown
        expr: >
          ((sum(increase(analytics_storage_errors_total[1m])) or vector(0))
           + (sum(increase(ingestion_readings_total{result="storage_error"}[1m])) or vector(0)) > 0)
          and on() (sum(up{job="ssle-storage"}) == 0)
        labels:
          severity: critical
          kind: root-cause
          root_cause: storage
        annotations:
          summary: "Root cause: storage is down; ingestion and analytics errors are a consequence"

      # Errors must still be happening (30 s window, held 30 s) and must not be explained by a
      # request flood: during the DDoS test analytics timed out on an overloaded storage and this
      # rule wrongly blamed the network, and it also went pending for the leftover errors right
      # after storage recovered.
      - alert: SSLERootCauseStorageUnreachable
        expr: >
          ((sum(rate(analytics_storage_errors_total[30s])) or vector(0))
           + (sum(rate(ingestion_readings_total{result="storage_error"}[30s])) or vector(0)) > 0)
          and on() (sum(up{job="ssle-storage"}) > 0)
          unless on() (max(sum by (job) (rate(http_requests_total{job=~"ssle-.+"}[1m]))) > 5)
        for: 30s
        labels:
          severity: warning
          kind: root-cause
          root_cause: network-or-discovery
        annotations:
          summary: "Storage is up but dependents cannot reach it: check the network/firewall or the registry"

      - alert: SSLEStorageNotRegistered
        expr: absent(registry_instances{service="storage-service"}) and on() (sum(up{job="ssle-registry"}) > 0)
        for: 10s
        labels:
          severity: warning
          kind: symptom
        annotations:
          summary: "The registry has no storage-service instance (removed after failed health checks)"

      - alert: SSLERootCauseIngestionDown
        expr: >
          (sum(increase(sensor_readings_sent_total{result="error"}[1m])) > 0)
          and on() (sum(up{job="ssle-ingestion"}) == 0)
        labels:
          severity: critical
          kind: root-cause
          root_cause: ingestion
        annotations:
          summary: "Root cause: ingestion is down; sensors cannot deliver readings"

      - alert: SSLERootCauseRequestFlood
        expr: >
          (histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[15s]))) > 0.05)
          and on(job) (sum by (job) (rate(http_requests_total[15s])) > 5)
        labels:
          severity: critical
          kind: root-cause
          root_cause: request-flood
        annotations:
          summary: "Root cause: {{ $labels.job }} is slow because of a request flood (see Wazuh rule 100210 for the source IPs)"
