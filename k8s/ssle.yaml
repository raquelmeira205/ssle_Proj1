# SSLE on k3s (Guide 2, section 5.2). Applied by k3s/deploy.sh, which replaces __TAG__ with the
# image tag it just built. Generated layout (edit freely):
#   - every k3s node is a location: k3s-master = dc1, k3s-node1 = dc2 (node label ssle.dc)
#   - ingestion, analytics and the sensor run once PER LOCATION (one Deployment each, nodeSelector);
#     registry and storage (single SQLite writer) run in dc1
#   - each pod registers ITS OWN address (status.podIP), so replicas are separate registry entries
#   - NODE = k3s node (physical), INSTANCE = pod name (logical) -> hierarchical ID
#   - the JSON access log goes to the node: /var/log/ssle/<pod>/access.log (read by the node's
#     Wazuh agent, k3s/install-wazuh-node-agents.sh)
#   - ingestion and analytics are published on NodePorts 30001/30003 with externalTrafficPolicy
#     Local; registry and storage are ClusterIP only
apiVersion: v1
kind: Namespace
metadata:
  name: ssle
---
apiVersion: v1
kind: ConfigMap
metadata: { name: location, namespace: ssle }
data:
  COUNTRY: pt
  REGION: centro
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: registry, namespace: ssle, labels: { app: registry, dc: dc1 } }
spec:
  replicas: 1
  selector: { matchLabels: { app: registry, dc: dc1 } }
  template:
    metadata:
      labels: { app: registry, dc: dc1, rack: rack1 }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "5050" }
    spec:
      nodeSelector: { ssle.dc: dc1 }
      containers:
        - name: registry
          image: docker.incus:5000/ssle/registry:__TAG__
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5050 }]
          envFrom: [{ configMapRef: { name: location } }]
          env:
            - { name: DC, value: dc1 }
            - { name: RACK, valueFrom: { fieldRef: { fieldPath: "metadata.labels['rack']" } } }
            - { name: NODE, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: INSTANCE, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: SERVICE_URL, value: "http://$(POD_IP):5050" }   # the POD, not the Service
            - { name: ACCESS_LOG, value: /var/log/ssle/access.log }
          readinessProbe: { httpGet: { path: /health, port: 5050 }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health, port: 5050 }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }   # restart only after ~60 s of silence: a pod that is merely slow (flood, busy VM) is not killed
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }    # also caps what a flood can take from the node
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: logs, mountPath: /var/log/ssle, subPathExpr: $(INSTANCE) }
      volumes:
        - name: logs
          hostPath: { path: /var/log/ssle, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: ssle }
spec:
  type: ClusterIP                 # internal only (no authentication: never expose the registry)
  selector: { app: registry }
  ports: [{ port: 5050, targetPort: 5050 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: storage-data, namespace: ssle }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage, namespace: ssle, labels: { app: storage, dc: dc1 } }
spec:
  replicas: 1
  strategy: { type: Recreate }   # SQLite = single writer
  selector: { matchLabels: { app: storage, dc: dc1 } }
  template:
    metadata:
      labels: { app: storage, dc: dc1, rack: rack1 }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "5002" }
    spec:
      nodeSelector: { ssle.dc: dc1 }
      containers:
        - name: storage
          image: docker.incus:5000/ssle/storage:__TAG__
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5002 }]
          envFrom: [{ configMapRef: { name: location } }]
          env:
            - { name: DC, value: dc1 }
            - { name: RACK, valueFrom: { fieldRef: { fieldPath: "metadata.labels['rack']" } } }
            - { name: NODE, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: INSTANCE, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: SERVICE_URL, value: "http://$(POD_IP):5002" }   # the POD, not the Service
            - { name: REGISTRY_URL, value: "http://registry:5050" }
            - { name: DB_PATH, value: /data/temp_data.db }
            - { name: ACCESS_LOG, value: /var/log/ssle/access.log }
          readinessProbe: { httpGet: { path: /health, port: 5002 }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health, port: 5002 }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }   # restart only after ~60 s of silence: a pod that is merely slow (flood, busy VM) is not killed
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }    # also caps what a flood can take from the node
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /var/log/ssle, subPathExpr: $(INSTANCE) }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: storage-data }
        - name: logs
          hostPath: { path: /var/log/ssle, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata: { name: storage, namespace: ssle }
spec:
  type: ClusterIP                 # internal only
  selector: { app: storage }
  ports: [{ port: 5002, targetPort: 5002 }]
---
