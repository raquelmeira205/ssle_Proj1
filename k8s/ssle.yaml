# Guide 2, section 5.2 - deploy the services in Kubernetes (k3s).
#   kubectl apply -f ssle.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ssle
---
# ---------- registry ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: registry, namespace: ssle }
spec:
  replicas: 1
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      containers:
        - name: registry
          image: docker.incus:5000/ssle/registry:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5050 }]
          readinessProbe: { httpGet: { path: /health, port: 5050 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: ssle }
spec:
  type: NodePort
  selector: { app: registry }
  ports: [{ port: 5050, targetPort: 5050, nodePort: 30050 }]
---
# ---------- storage (keeps its SQLite file on a volume) ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: storage-data, namespace: ssle }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage, namespace: ssle }
spec:
  replicas: 1                 # SQLite = single writer
  strategy: { type: Recreate }
  selector: { matchLabels: { app: storage } }
  template:
    metadata: { labels: { app: storage } }
    spec:
      containers:
        - name: storage
          image: docker.incus:5000/ssle/storage:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5002 }]
          env:
            - { name: REGISTRY_URL, value: "http://registry:5050" }
            - { name: SERVICE_URL, value: "http://storage:5002" }
            - { name: DB_PATH, value: "/data/temp_data.db" }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /health, port: 5002 }, periodSeconds: 5 }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: storage-data }
---
apiVersion: v1
kind: Service
metadata: { name: storage, namespace: ssle }
spec:
  selector: { app: storage }
  ports: [{ port: 5002, targetPort: 5002 }]
---
# ---------- ingestion (2 replicas, balanced by the Kubernetes Service) ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: ingestion, namespace: ssle }
spec:
  replicas: 2
  selector: { matchLabels: { app: ingestion } }
  template:
    metadata: { labels: { app: ingestion } }
    spec:
      containers:
        - name: ingestion
          image: docker.incus:5000/ssle/ingestion:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5001 }]
          env:
            - { name: REGISTRY_URL, value: "http://registry:5050" }
            - { name: SERVICE_URL, value: "http://ingestion:5001" }
            - { name: STORAGE_URL, value: "http://storage:5002" }
          readinessProbe: { httpGet: { path: /health, port: 5001 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: ingestion, namespace: ssle }
spec:
  selector: { app: ingestion }
  ports: [{ port: 5001, targetPort: 5001 }]
---
# ---------- analytics ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics, namespace: ssle }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics } }
  template:
    metadata: { labels: { app: analytics } }
    spec:
      containers:
        - name: analytics
          image: docker.incus:5000/ssle/analytics:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5003 }]
          env:
            - { name: REGISTRY_URL, value: "http://registry:5050" }
            - { name: SERVICE_URL, value: "http://analytics:5003" }
            - { name: STORAGE_URL, value: "http://storage:5002" }
          readinessProbe: { httpGet: { path: /health, port: 5003 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: analytics, namespace: ssle }
spec:
  type: NodePort
  selector: { app: analytics }
  ports: [{ port: 5003, targetPort: 5003, nodePort: 30003 }]
---
# ---------- temperature sensor (no port, it only sends data) ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: sensor, namespace: ssle }
spec:
  replicas: 1
  selector: { matchLabels: { app: sensor } }
  template:
    metadata: { labels: { app: sensor } }
    spec:
      containers:
        - name: sensor
          image: docker.incus:5000/ssle/sensor:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: REGISTRY_URL, value: "http://registry:5050" }
            - { name: INGESTION_URL, value: "http://ingestion:5001" }
            - { name: DEVICE_ID, value: "sensor-001" }
