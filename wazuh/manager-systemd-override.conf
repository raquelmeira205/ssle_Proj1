# /etc/systemd/system/wazuh-manager.service.d/override.conf in wazuh-container
# (installed by `./apply-configs.sh wazuh`).
# The stock unit gives the manager 45 s to start and never retries. On a busy host (all lab
# containers booting at once) start-up took longer, systemd killed it, and the SIEM stayed down
# silently after a VM reboot on 2026-11-21. Allow 5 min and retry on failure.
[Unit]
StartLimitIntervalSec=0

[Service]
TimeoutStartSec=300
Restart=on-failure
RestartSec=30
